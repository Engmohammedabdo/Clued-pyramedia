<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad1)" rx="80"/>

  <!-- Pyramid Shape -->
  <g transform="translate(256, 256)">
    <!-- Main Pyramid -->
    <path d="M 0,-150 L 120,100 L -120,100 Z" fill="white" opacity="0.95"/>

    <!-- Pyramid Left Face -->
    <path d="M 0,-150 L -120,100 L -60,120 Z" fill="white" opacity="0.7"/>

    <!-- Pyramid Right Face -->
    <path d="M 0,-150 L 60,120 L 120,100 Z" fill="white" opacity="0.8"/>

    <!-- Media Wave -->
    <g transform="translate(0, 50)">
      <path d="M -80,20 Q -60,10 -40,20 T 0,20 T 40,20 T 80,20"
            stroke="white"
            stroke-width="3"
            fill="none"
            opacity="0.9"/>
      <circle cx="-80" cy="20" r="4" fill="white"/>
      <circle cx="-40" cy="20" r="4" fill="white"/>
      <circle cx="0" cy="20" r="4" fill="white"/>
      <circle cx="40" cy="20" r="4" fill="white"/>
      <circle cx="80" cy="20" r="4" fill="white"/>
    </g>
  </g>

  <!-- Brand Name (Optional - remove for simpler icon) -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        text-anchor="middle" fill="white" opacity="0.95">PYRAMEDIA</text>
</svg>
